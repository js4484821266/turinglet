name: saammaago

services:
  llm:
    build:
      context: .
      dockerfile: local-llm/Dockerfile
      target: cpu
    environment:
      HF_LOCAL_HOST: 0.0.0.0
      HF_LOCAL_PORT: 8010
      HF_ALLOW_MODEL_DOWNLOAD: "true"
      HF_MODEL_CACHE_DIR: /models
      HF_MODEL_REPO: ${HF_MODEL_REPO:-bartowski/Qwen2.5-1.5B-Instruct-GGUF}
      HF_MODEL_FILE: ${HF_MODEL_FILE:-Qwen2.5-1.5B-Instruct-Q4_K_M.gguf}
      HF_N_GPU_LAYERS: "0"
    volumes:
      - ./local-llm/models:/models
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)
      interval: 10s
      timeout: 6s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      llm:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_PROVIDER: sqlite
      SQLITE_PATH: /data/local-dev.db
      MOCK_PROVIDER: "false"
      LLM_PROVIDER: hf-local
      HF_LOCAL_URL: http://llm:8010
      HF_LOCAL_TIMEOUT_MS: ${HF_LOCAL_TIMEOUT_MS:-120000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-30}
      PROACTIVE_POLL_MS: ${PROACTIVE_POLL_MS:-5000}
      PROACTIVE_MIN_SILENCE_MS: ${PROACTIVE_MIN_SILENCE_MS:-120000}
      PROACTIVE_COOLDOWN_MS: ${PROACTIVE_COOLDOWN_MS:-240000}
      USER_CONTINUATION_GRACE_MS: ${USER_CONTINUATION_GRACE_MS:-600}
      REACTIVE_RESPONSE_MAX_WAIT_MS: ${REACTIVE_RESPONSE_MAX_WAIT_MS:-20000}
    ports:
      - "${APP_PORT:-80}:4000"
    volumes:
      - ./database:/data
      - ./runtime:/app/runtime
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    restart: unless-stopped
